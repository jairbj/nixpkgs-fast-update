name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Flake check and build
        run: |
          nix flake check -L
          nix build -L .#grok-build .#claude-code .#pad .#code-server .#antigravity-cli
